[build-system]
requires = ["setuptools>=70"]
build-backend = "setuptools.build_meta"

[project]
name = "stockswitch"
version = "0.1.0"
description = "A-share market research and paper trading desktop application"
requires-python = ">=3.12"
dependencies = ["PySide6>=6.7,<7", "tzdata>=2025.2"]

[tool.setuptools.packages.find]
include = ["src*"]
