[build-system]
requires = ["setuptools>=70"]
build-backend = "setuptools.build_meta"

[project]
name = "stockswitch"
dynamic = ["version"]
description = "A-share market research and paper trading desktop application"
requires-python = ">=3.12"
dependencies = ["PySide6>=6.7,<7", "tzdata>=2025.2"]

[project.optional-dependencies]
windows-build = ["pyinstaller>=6.12,<7"]

[tool.setuptools.packages.find]
include = ["src*"]

[tool.setuptools.dynamic]
version = {attr = "src.app.version.VERSION"}
